<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti mi reina 🌻</title>
    <!-- Tailwind CSS for layout and layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Great Vibes for elegant cursive, Poppins for fallbacks -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #090910 0%, #17153B 50%, #2E236C 100%);
            font-family: 'Poppins', sans-serif;
        }

        /* Container for the canvas */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism styling for the card */
        .glass-card {
            background: rgba(20, 15, 35, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 215, 0, 0.05),
                0 0 30px rgba(255, 215, 0, 0.15);
            animation: float 6s ease-in-out infinite, glow 4s ease-in-out infinite alternate;
        }

        /* Floating animation for the center card */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Subtle glowing border animation */
        @keyframes glow {
            0% { border-color: rgba(255, 215, 0, 0.2); box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.1); }
            100% { border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 40px rgba(255,215,0,0.3); }
        }

        /* Elegant cursive typography */
        .text-cursive {
            font-family: 'Great Vibes', cursive;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* Fade-in effect for the UI */
        .fade-in {
            animation: fadeIn 3s ease-in forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Canvas for rendering the dense flower animation -->
    <canvas id="flowerCanvas" id="canvas-container"></canvas>

    <!-- UI Overlay: Glassmorphism Card -->
    <main class="relative z-10 w-full max-w-2xl px-6 fade-in pointer-events-none">
        <div class="glass-card rounded-3xl p-8 md:p-12 text-center">
            <h1 class="text-cursive text-5xl md:text-7xl lg:text-8xl text-yellow-300 leading-tight">
                Perdón por la demora, sé que no son reales pero son iguales de hermosas, te amo mi reina
            </h1>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration for the flower density
        const FLOWER_COUNT = 120; // Number of simultaneous flowers
        const STAR_COUNT = 200;   // Number of background stars

        // Array to store particle instances
        let flowers = [];
        let stars = [];

        // Color palettes for the flowers (Variations of Yellow and Gold)
        const flowerColors = [
            { primary: '#FFD700', secondary: '#FFB300' }, // Classic Gold
            { primary: '#FFE135', secondary: '#FFC107' }, // Banana Yellow
            { primary: '#FADA5E', secondary: '#F39C12' }, // Naples Yellow
            { primary: '#FFEA00', secondary: '#FFA000' }  // Bright Yellow
        ];

        // Resize canvas to fit the window perfectly
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.zIndex = '1';
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
                // Randomize initial Y so they cover the screen from the start
                this.y = Math.random() * canvas.height; 
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100; // Start below screen occasionally
                this.size = Math.random() * 1.5 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.brightness = Math.random();
                this.fadeDirection = Math.random() > 0.5 ? 1 : -1;
            }

            update() {
                // Slowly float upwards
                this.y -= this.speed;
                
                // Twinkle effect
                this.brightness += 0.01 * this.fadeDirection;
                if (this.brightness >= 1) {
                    this.brightness = 1;
                    this.fadeDirection = -1;
                } else if (this.brightness <= 0.2) {
                    this.brightness = 0.2;
                    this.fadeDirection = 1;
                }

                // Reset if it goes off the top
                if (this.y < -10) {
                    this.reset();
                    this.y = canvas.height + 10;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
                ctx.fill();
            }
        }

        class Flower {
            constructor(isInitial = false) {
                this.reset(isInitial);
            }

            reset(isInitial = false) {
                this.x = Math.random() * canvas.width;
                // If initial, spawn anywhere. If resetting, spawn at bottom or random edges
                if (isInitial) {
                    this.y = Math.random() * canvas.height;
                    this.opacity = Math.random() * 0.8 + 0.2;
                } else {
                    this.y = canvas.height + Math.random() * 200 + 50;
                    this.opacity = 0; // Starts invisible and blooms/fades in
                }

                // Parallax depth (z-index simulation)
                this.z = Math.random() * 0.8 + 0.3; 
                
                // Size mapping
                this.maxSize = (Math.random() * 35 + 25) * this.z;
                this.currentSize = isInitial ? this.maxSize * (Math.random() * 0.5 + 0.5) : 0;
                
                // Movement physics
                this.vy = -(Math.random() * 1.5 + 0.8) * this.z; // Float upwards
                this.vx = (Math.random() - 0.5) * 1.5; // Slight horizontal drift
                
                // Rotation
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;

                // Floral properties
                this.petals = Math.floor(Math.random() * 6) + 12; // 12 to 17 petals
                const colorTheme = flowerColors[Math.floor(Math.random() * flowerColors.length)];
                this.primaryColor = colorTheme.primary;
                this.secondaryColor = colorTheme.secondary;
                
                // Center core colors
                this.coreDark = '#3E2723'; // Very dark brown
                this.coreLight = '#5C3A21'; // Medium brown
            }

            update() {
                // Update position
                this.y += this.vy;
                this.x += this.vx;
                this.rotation += this.rotationSpeed;

                // Gentle horizontal oscillation (wind effect)
                this.x += Math.sin(this.y * 0.01) * 0.5;

                // Blooming (growing size)
                if (this.currentSize < this.maxSize) {
                    this.currentSize += 0.2;
                }

                // Fading in
                if (this.opacity < 1) {
                    this.opacity += 0.01;
                }

                // Reset when floating way out of top bounds
                if (this.y < -this.maxSize * 2 - 20) {
                    this.reset(false);
                }
                
                // Wrap around horizontally if they drift too far off screen
                if (this.x > canvas.width + this.maxSize) this.x = -this.maxSize;
                if (this.x < -this.maxSize) this.x = canvas.width + this.maxSize;
            }

            draw() {
                if (this.currentSize <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;

                const size = this.currentSize;

                // Draw petals
                for (let i = 0; i < this.petals; i++) {
                    ctx.rotate((Math.PI * 2) / this.petals);
                    ctx.beginPath();
                    
                    // Create beautiful curved petals using bezier curves
                    ctx.moveTo(0, 0);
                    // Control points for the petal shape
                    ctx.quadraticCurveTo(size / 1.5, -size / 2, size, 0);
                    ctx.quadraticCurveTo(size / 1.5, size / 2, 0, 0);
                    
                    // Alternate colors slightly for depth
                    ctx.fillStyle = i % 2 === 0 ? this.primaryColor : this.secondaryColor;
                    ctx.fill();
                    
                    // Subtle stroke for petal separation
                    ctx.strokeStyle = "rgba(200, 150, 0, 0.4)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Draw Flower Center (Disc)
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = this.coreLight;
                ctx.fill();

                // Inner core detail
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = this.coreDark;
                ctx.fill();

                // Tiny decorative dots inside the center (seeds)
                ctx.fillStyle = '#D7CCC8';
                for(let i=0; i<5; i++) {
                    ctx.beginPath();
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.random() * (size * 0.2);
                    ctx.arc(Math.cos(angle)*r, Math.sin(angle)*r, size*0.03, 0, Math.PI*2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // Initialize Stars
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        // Initialize Flowers
        for (let i = 0; i < FLOWER_COUNT; i++) {
            // Pass 'true' to spawn them immediately scattered across the screen
            flowers.push(new Flower(true)); 
        }

        // Main Animation Loop
        function animate() {
            // Clear canvas entirely every frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update and draw stars first (background)
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Sort flowers by depth (z) so larger ones draw on top
            flowers.sort((a, b) => a.z - b.z);

            // Update and draw flowers
            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animate);
        }

        // Start animation immediately
        animate();
    </script>
</body>
</html>
